
name: API Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'postman/collections/**'
      - '.github/workflows/api-tests.yml'

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Newman
        run: npm install --global newman

      - name: Run Postman collection
        run: >
          newman run
          "postman/collections/NordVPN QA Advanced Automation Collection.postman_collection.json"
