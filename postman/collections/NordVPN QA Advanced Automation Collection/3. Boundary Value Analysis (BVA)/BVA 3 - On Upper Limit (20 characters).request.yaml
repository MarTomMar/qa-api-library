$kind: http-request
url: "{{baseUrl}}/api/v1/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "email": "{{bva20_email}}",
        "password": "12345678901234567890"
    }
scripts:
  - type: beforeRequest
    code: |-
      const randomInt = Math.floor(Math.random() * 100000);
      pm.collectionVariables.set("bva20_email", `bva20_${randomInt}@nordvpn-test.com`);
    language: text/javascript
  - type: afterResponse
    code: |-
      const responseData = pm.response.json();
      if (responseData.token) {
          let queue = pm.collectionVariables.get("tokensToDelete");
          queue = queue ? JSON.parse(queue) : [];
          queue.push(responseData.token);
          pm.collectionVariables.set("tokensToDelete", JSON.stringify(queue));
      }
    language: text/javascript
order: 3000
